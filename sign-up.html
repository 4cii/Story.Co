<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  
    <div class="page">
      <!-- Gambar cafe (kiri) -->
      <div class="visual">
        <img class="visual-img" src="assets/cafe-signup-img.png" alt="" />
      </div>

      <!-- Form (kanan) -->
      <main class="panel">
        <div class="panel-inner">
          <h1 class="title">Sign In</h1>

          <form class="form" action="#" method="post">
            <div class="field">
              <label for="name">Name</label>
              <input
                id="name"
                name="name"
                type="text"
                placeholder="Your Name..."
                autocomplete="name"
                required
              />
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="Your Email..."
                autocomplete="email"
                required
              />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Input Password..."
                autocomplete="current-password"
                required
              />
            </div>

            <p
              class="form-hint"
              id="auth-error"
              role="status"
              aria-live="polite"
            ></p>

            <button class="btn btn-primary" type="submit">Sign In →</button>
          </form>
        </div>
      </main>
    </div>

    <script src="js/auth.js"></script>
  </body>
</html>
