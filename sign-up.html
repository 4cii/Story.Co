<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page">

    <!-- Gambar cafe (kiri) -->
    <div class="visual">
      <img class="visual__img" src="assets/cafe-signup-img.png" alt="">
    </div>

    <!-- Form (kanan) -->
    <main class="panel">
      <div class="panel__inner">
        <h1 class="title">Sign Up</h1>

        <form class="form" action="#" method="post">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your Name..." autocomplete="name" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Your Email..." autocomplete="email" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Input Password" autocomplete="new-password" required>
          </div>

          <button class="btn-primary" type="submit">Sign Up →</button>
        </form>

        <p class="login-text">Already have an account? <a href="#">Login.</a></p>

        <div class="divider"><span>Or</span></div>

        <button class="btn-google" type="button">
          <!-- logo Google -->
          <img src="assets/google.svg" alt="" width="36" height="36">
          <span>Sign up with Google</span>
        </button>
      </div>
    </main>

  </div>

</body>
</html>
