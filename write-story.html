<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story.Co</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="write-sect">
      <a href="index.html" class="back-btn"
        ><img src="assets/back-btn.png" alt=""
      /></a>
      <h1 class="write-title">Sit with me</h1>
      <div class="writing-table">
        <img class="table-img" src="assets/table.png" alt="table" />

        <div class="writing-form">
          <!-- back btn -->
          <button
            type="button"
            class="book-btn"
            id="book-btn"
            aria-label="Open the menu to start writing"
          >
            <img src="assets/menu-book.png" alt="menu book" />
          </button>

          <div class="writing-base">
            <!-- write & draw -->
            <div class="writing-input" id="write-step">
              <form class="story-form" id="story-form" novalidate>
                <!-- text field -->
                <div class="input-one">
                  <label class="story-label" id="story-label" for="write-story"
                    >My story...></label
                  >

                  <textarea
                    id="write-story"
                    name="write-story"
                    maxlength="2000"
                    aria-describedby="form-hint"
                  ></textarea>

                  <!-- mode gambar -->
                  <div class="draw-area" id="draw-area" hidden>
                    <div class="canvas-wrap">
                      <canvas
                        id="draw-canvas"
                        aria-label="Drawing area"
                      ></canvas>
                    </div>

                    <div class="draw-bar">
                      <button
                        type="button"
                        class="tool-btn"
                        id="undo"
                        aria-label="Undo"
                        disabled
                      >
                        ↶
                      </button>

                      <div
                        class="draw-tools"
                        role="group"
                        aria-label="Brush color"
                      >
                        <button
                          type="button"
                          class="swatch"
                          data-color="#c0554f"
                          aria-label="Red"
                          aria-pressed="false"
                        ></button>
                        <button
                          type="button"
                          class="swatch"
                          data-color="#e38025"
                          aria-label="Orange"
                          aria-pressed="false"
                        ></button>
                        <button
                          type="button"
                          class="swatch"
                          data-color="#e2b95f"
                          aria-label="Gold"
                          aria-pressed="true"
                        ></button>
                        <button
                          type="button"
                          class="swatch"
                          data-color="#459063"
                          aria-label="Green"
                          aria-pressed="false"
                        ></button>
                        <button
                          type="button"
                          class="swatch"
                          data-color="#2f9fb5"
                          aria-label="Teal"
                          aria-pressed="false"
                        ></button>
                      </div>

                      <button
                        type="button"
                        class="tool-btn"
                        id="redo"
                        aria-label="Redo"
                        disabled
                      >
                        ↷
                      </button>
                    </div>
                  </div>

                  <p
                    class="form-hint"
                    id="form-hint"
                    role="status"
                    aria-live="polite"
                  ></p>
                </div>
                <!-- mood cat -->
                <div
                  class="input-two"
                  role="radiogroup"
                  aria-labelledby="mood-label"
                >
                  <span class="mood-label" id="mood-label">My mood</span>
                  <div id="mood-picker">
                    <label class="mood">
                      <input type="radio" name="mood" value="angry" />
                      <img src="assets/mood-angry.png" alt="Angry" />
                    </label>
                    <label class="mood">
                      <input type="radio" name="mood" value="stressed" />
                      <img src="assets/mood-stressed.png" alt="Stressed" />
                    </label>
                    <label class="mood">
                      <input type="radio" name="mood" value="happy" />
                      <img src="assets/mood-happy.png" alt="Happy" />
                    </label>
                    <label class="mood">
                      <input type="radio" name="mood" value="calm" />
                      <img src="assets/mood-calm.png" alt="Calm" />
                    </label>
                    <label class="mood">
                      <input type="radio" name="mood" value="sad" />
                      <img src="assets/mood-sad.png" alt="Sad" />
                    </label>
                  </div>
                </div>
              </form>
            </div>
            <!-- send btn -->
            <button
              class="btn send-btn"
              id="send-btn"
              type="submit"
              form="story-form"
            >
              Send →
            </button>

            <!-- scene2-choose menu -->
            <div class="writing-input menu-input" id="menu-step" hidden>
              <form class="menu-form" id="menu-form" novalidate>
                <h2 class="menu-title">Choose the menu</h2>

                <!-- radio fix -->
                <div
                  class="menu-grid"
                  role="radiogroup"
                  aria-label="Choose a drink"
                >
                  <label class="menu-item">
                    <input type="radio" name="menu" value="Matcha" />
                    <img src="assets/drink-1.png" alt="Matcha" />
                  </label>
                  <label class="menu-item">
                    <input type="radio" name="menu" value="GreenTea" />
                    <img src="assets/drink-5.png" alt="GreenTea" />
                  </label>
                  <label class="menu-item">
                    <input type="radio" name="menu" value="CocoaMallow" />
                    <img src="assets/drink-2.png" alt="CocoaMallow" />
                  </label>
                  <label class="menu-item">
                    <input type="radio" name="menu" value="Coffee" />
                    <img src="assets/drink-coffee.png" alt="Coffee" />
                  </label>
                  <label class="menu-item">
                    <input type="radio" name="menu" value="Latte" />
                    <img src="assets/drink-latte.png" alt="Latte" />
                  </label>
                  <label class="menu-item">
                    <input type="radio" name="menu" value="Tea" />
                    <img src="assets/drink-tea.png" alt="Tea" />
                  </label>
                </div>

                <p
                  class="form-hint"
                  id="menu-hint"
                  role="status"
                  aria-live="polite"
                ></p>
              </form>
            </div>
            <!-- final btn -->
            <button
              class="btn send-btn"
              id="order-btn"
              type="submit"
              form="menu-form"
              hidden
            >
              Order →
            </button>

            <!-- sucsess alert (dipindah ke dalam .writing-base) -->
            <div class="writing-input success-panel" id="success-panel" hidden>
              <h2 class="success-title">Your order is in!</h2>
              <p class="success-text">Keep this code to see your story later.</p>
              <button
                type="button"
                class="code-chip"
                id="code-chip"
                aria-label="Copy your code"
              >
                <span id="story-code"></span>
              </button>
              <p
                class="success-note"
                id="copy-hint"
                role="status"
                aria-live="polite"
              >
                Tap the code to copy it. We can't recover it.
              </p>
              <button type="button" class="btn" id="write-again">
                Write another
              </button>
            </div>
          </div>

          <!-- pensil = mode tulis -->
          <div class="pencil-sect">
            <button
              type="button"
              class="mode-btn"
              data-mode="write"
              aria-pressed="true"
            >
              <img src="assets/pencil.png" alt="" />
              <span class="sr-only">Write</span>
            </button>
          </div>

          <!-- brush = mode gambar -->
          <div class="brush-sect">
            <button
              type="button"
              class="mode-btn"
              data-mode="draw"
              aria-pressed="false"
            >
              <img src="assets/brush.png" alt="" />
              <span class="sr-only">Draw</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/write.js"></script>
  </body>
</html>
