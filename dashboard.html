<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Story.Co - Admin Panel</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="admin">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="logo">
          <img src="assets/logo-storyco.png" alt="Story.Co" />
        </div>

        <nav class="menu">
          <a href="#overview"
            ><img src="assets/overview.png" alt="" />Overview</a
          >
          <a href="#delete-stories"
            ><img src="assets/trash.png" alt="" />Delete Stories</a
          >
          <a href="#published-stories"
            ><img src="assets/published.png" alt="" />Published Stories</a
          >
          <a href="#urgent-cases"
            ><img src="assets/sirine.png" alt="" />Urgent Cases</a
          >
        </nav>

        <button class="logout">
          <img src="assets/logout.png" alt="" />Log Out
        </button>
      </aside>

      <!-- MAINPAGE -->
      <main class="main">
        <h1 class="greeting" id="title"></h1>
        <p class="subtitle" id="subtitle"></p>

        <section class="stats" id="stats">
          <div class="card card-waiting">
            <p>Waiting :</p>
            <strong id="count-waiting">0</strong>
          </div>
          <div class="card card-published">
            <p>Published Today :</p>
            <strong id="count-published">0</strong>
          </div>
          <div class="card card-attention">
            <p>Needs Attention :</p>
            <strong id="count-attention">0</strong>
          </div>
        </section>

        <div class="toolbar">
          <label class="search">
            <img src="assets/akar-icons_search.png" alt="" />
            <input type="text" placeholder="Cari kata dalam cerita..." />
          </label>
          <select class="category">
            <option value="all">Moods Category</option>
            <option value="angry">Angry</option>
            <option value="stressed">Stressed</option>
            <option value="happy">Happy</option>
            <option value="calm">Calm</option>
            <option value="sad">Sad</option>
          </select>
        </div>

        <section class="list" id="story-list" aria-live="polite"></section>

        <template id="story-template">
          <article class="story">
            <div class="story-row">
              <div class="story-body">
                <div class="tags">
                  <span class="badge" data-f="status"></span>
                  <span class="badge" data-f="mood"></span>
                </div>

                <p class="note" data-f="note" hidden></p>
                <p class="story-text" data-f="text"></p>
                <img
                  class="story-img"
                  data-f="image"
                  alt="Drawing story"
                  hidden
                />

                <div class="meta">
                  <span data-f="code"></span>
                  <span data-f="ago"></span>
                </div>
              </div>

              <button type="button" class="action-btn" aria-expanded="false">
                Action
                <img
                  src="assets/arrow-down.svg"
                  alt=""
                  onerror="this.style.display = 'none'"
                />
              </button>
            </div>

            <div class="action-menu" role="menu">
              <h3>Change Story Status</h3>

              <button
                type="button"
                class="option option-delete"
                data-status="deleted"
              >
                <img src="assets/trash.png" alt="" />
                <div>
                  <strong>Delete</strong>
                  <span>Permanently remove this story from the platform.</span>
                </div>
              </button>

              <button
                type="button"
                class="option option-publish"
                data-status="published"
              >
                <img src="assets/published.png" alt="" />
                <div>
                  <strong>Publish Today</strong>
                  <span>Approve and show on board</span>
                </div>
              </button>

              <button
                type="button"
                class="option option-attention"
                data-status="attention"
              >
                <img src="assets/sirine.png" alt="" />
                <div>
                  <strong>Needs Attention</strong>
                  <span>Approve and show on board</span>
                </div>
              </button>

              <button
                type="button"
                class="option option-restore"
                data-status="waiting"
              >
                <img src="assets/overview.png" alt="" />
                <div>
                  <strong>Restore Story</strong>
                  <span>Move back to waiting list</span>
                </div>
              </button>
            </div>
          </article>
        </template>
      </main>
    </div>

    <!-- js -->
    <script src="js/data.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
